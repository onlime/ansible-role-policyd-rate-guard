---
# Fresh install on Debian 13 with Percona Server 8.4.
# The app comes from GitHub (POLICYD_VERSION, default: the role's policyd_version), or from a local checkout:
#   POLICYD_REPO_PATH=$PWD/../policyd-rate-guard POLICYD_VERSION=main molecule test
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
driver:
  name: docker
platforms:
  - name: policyd-debian13
    image: geerlingguy/docker-debian13-ansible:latest
    pre_build_image: true
    command: ''
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - ${POLICYD_REPO_PATH:-/dev/null}:/srv/policyd-rate-guard:ro
provisioner:
  name: ansible
  playbooks:
    prepare: ../shared/prepare.yml
    verify: verify.yml
  inventory:
    group_vars:
      all:
        policyd_repo: "{{ lookup('env', 'POLICYD_REPO_PATH') | ternary('/srv/policyd-rate-guard', 'https://github.com/onlime/policyd-rate-guard.git') }}"
        # special characters, to test the quoting in the env file and the URL-encoding in yoyo.ini
        policyd_mysql_pass: 'p@ss:w/rd%1"x#y\z'
        policyd_yoyo_mysql_pass: 'yoyo?#&%pass'
        # as in production: the JWT webhook (validated by `check`; nothing calls it below the quota)
        policyd_webhook_enabled: true
        policyd_webhook_url: 'https://airpane.example/api/policyd/{sender}'
        policyd_webhook_secret: Wk9YZXliVlVtY2pQcFlFUm9KY1U1ZkFFaUpWTk1FU20=
        # a unix socket for Postfix in addition to TCP
        policyd_listen:
          - 127.0.0.1:10033
          - /var/spool/postfix/private/policyd-rate-guard
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - destroy
    - create
    - prepare
    - check
    - converge
    - idempotence
    - check
    - verify
    - destroy

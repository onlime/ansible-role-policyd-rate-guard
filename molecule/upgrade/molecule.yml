---
# Upgrade from role 0.5.3 with PolicydRateGuard 0.7.4 (postfix-owned checkout, world-readable .env, daemon on
# 127.0.0.1:10033 as postfix) to role 1.0, on Debian 13 with Percona Server 8.4.
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
driver:
  name: docker
platforms:
  - name: policyd-upgrade-debian13
    image: geerlingguy/docker-debian13-ansible:latest
    pre_build_image: true
    command: ''
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - ${POLICYD_REPO_PATH:-/dev/null}:/srv/policyd-rate-guard:ro
provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        policyd_repo: "{{ lookup('env', 'POLICYD_REPO_PATH') | ternary('/srv/policyd-rate-guard', 'https://github.com/onlime/policyd-rate-guard.git') }}"
        policyd_version: "{{ lookup('env', 'POLICYD_VERSION') | default('v1.0.0', true) }}"
        policyd_mysql_pass: legacy-app-password
        policyd_yoyo_mysql_pass: new-migration-password
        policyd_webhook_secret: ''
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - destroy
    - create
    - prepare
    - check
    - converge
    - idempotence
    - verify
    - destroy

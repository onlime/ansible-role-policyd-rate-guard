---
- name: Base system
  ansible.builtin.import_playbook: ../shared/prepare.yml

- name: Install the legacy role 0.5.3 with PolicydRateGuard 0.7.4
  hosts: all
  gather_facts: true
  vars:
    legacy_role_path: '{{ lookup("env", "MOLECULE_EPHEMERAL_DIRECTORY") }}/legacy-role'
  tasks:
    - name: Extract role v0.5.3 from this repository
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: >-
          set -o pipefail; rm -rf {{ legacy_role_path | quote }} && mkdir -p {{ legacy_role_path | quote }}
          && git -C {{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | quote }} archive v0.5.3 | tar -x -C {{ legacy_role_path | quote }}
      delegate_to: localhost
      become: false
      changed_when: true

    # Role 0.5.3 runs its first migration before it creates the users, so it always fails on a fresh host
    - name: Pre-create the legacy database user
      ansible.mysql.mysql_user:
        name: policyd
        plugin: caching_sha2_password
        plugin_auth_string: '{{ policyd_mysql_pass }}'
        priv: 'policyd-rate-guard.*:ALL'
        state: present

    - name: Run role v0.5.3
      ansible.builtin.include_role:
        name: '{{ legacy_role_path }}'
      vars:
        policyd_version: v0.7.4
        policyd_yoyo_mysql_user: '{{ policyd_mysql_user | default("policyd") }}'
        policyd_yoyo_mysql_pass: '{{ policyd_mysql_pass }}'

    - name: Flush the legacy role's handlers (migrations, restart)
      ansible.builtin.meta: flush_handlers

    - name: Wait for the legacy daemon
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 10033
        timeout: 30

    - name: Send a request to the legacy daemon
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          exec 3<>/dev/tcp/127.0.0.1/10033
          printf '%s\n' request=smtpd_access_policy protocol_state=DATA queue_id=LEGACY1 sender=a@example.com \
            recipient_count=3 client_address=192.0.2.10 client_name=client.example.net sasl_method=PLAIN \
            sasl_username=legacy@example.com '' >&3
          timeout 10 head -n 1 <&3
      register: legacy_reply
      changed_when: false
      failed_when: legacy_reply.stdout != 'action=OK'

    - name: Stat the legacy files
      ansible.builtin.stat:
        path: /opt/policyd-rate-guard/.env
      register: legacy_env

    - name: The legacy state is what 0.5.3 left behind (postfix-owned, world-readable secrets)
      ansible.builtin.assert:
        that:
          - legacy_env.stat.pw_name == 'postfix'
          - legacy_env.stat.mode == '0644'
        quiet: true

---
# Debian 13 with Postfix and Percona Server 8.4 (as on our MX hosts); root logs in through ~/.my.cnf
- name: Prepare
  hosts: all
  gather_facts: true
  tasks:
    - name: A Python wrapper with umask 077 for the default scenario's converge
      ansible.builtin.copy:
        dest: /usr/local/bin/python3-umask077
        content: |
          #!/bin/sh
          umask 077
          exec /usr/bin/python3 "$@"
        mode: '0755'

    - name: Install base packages
      ansible.builtin.apt:
        name: [ca-certificates, curl, gnupg, git, postfix, python3-pymysql, logrotate]
        update_cache: true
      environment:
        DEBIAN_FRONTEND: noninteractive

    - name: Install percona-release
      ansible.builtin.apt:
        deb: https://repo.percona.com/apt/percona-release_latest.generic_all.deb

    - name: Enable the Percona Server 8.4 repository
      ansible.builtin.command:
        cmd: percona-release setup -y ps-84-lts
        creates: /etc/apt/sources.list.d/percona-ps-84-lts-release.list

    - name: Install Percona Server 8.4
      ansible.builtin.apt:
        name: percona-server-server
        update_cache: true
      environment:
        DEBIAN_FRONTEND: noninteractive

    - name: Start MySQL
      ansible.builtin.systemd_service:
        name: mysql
        state: started
        enabled: true

    - name: Root login through the unix socket
      ansible.builtin.copy:
        dest: /root/.my.cnf
        content: |
          [client]
          user = root
          socket = /run/mysqld/mysqld.sock
        mode: '0600'

    # The app repo is mounted from the host (owned by another uid)
    - name: Trust the mounted app repository  # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: git config --system --add safe.directory /srv/policyd-rate-guard
      changed_when: true
      when: lookup('env', 'POLICYD_REPO_PATH') | length > 0

    # A fresh host as the role must handle it: without the Python libraries the image ships (the pip module needs
    # python3-packaging, which the role installs), and with a module that a local user planted in /tmp, which root
    # mustn't import (verify.yml checks the marker)
    - name: Remove pip, setuptools and packaging from the system Python
      ansible.builtin.apt:
        name: [python3-pip, python3-wheel, python3-setuptools, python3-pkg-resources, python3-packaging]
        state: absent
        purge: true
      when: lookup('env', 'MOLECULE_SCENARIO_NAME') == 'default'

    - name: Plant /tmp/venv.py
      ansible.builtin.copy:
        dest: /tmp/venv.py
        content: |
          open('/tmp/planted-venv-ran', 'w').close()
        owner: nobody
        mode: '0644'
      when: lookup('env', 'MOLECULE_SCENARIO_NAME') == 'default'

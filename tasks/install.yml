---
- name: Check out PolicydRateGuard {{ policyd_version }}
  ansible.builtin.git:
    repo: '{{ policyd_repo }}'
    dest: '{{ policyd_install_path }}'
    version: '{{ policyd_version }}'
    umask: '0022'
    force: false
  register: policyd_git
  notify: Restart policyd service

- name: Make sure the install directory is root-owned
  ansible.builtin.file:
    path: '{{ policyd_install_path }}'
    state: directory
    owner: root
    group: root
    mode: '0755'

# Python's minor version changes with a Debian release upgrade, which leaves the venv broken
- name: Read the Python version of the existing venv
  ansible.builtin.slurp:
    src: '{{ policyd_venv_path }}/pyvenv.cfg'
  register: policyd_pyvenv_cfg
  failed_when: false

- name: Remove a venv of another Python version
  ansible.builtin.file:
    path: '{{ policyd_venv_path }}'
    state: absent
  when:
    - policyd_pyvenv_cfg.content is defined
    - >-
      ('version = ' ~ ansible_facts['python']['version']['major'] ~ '.' ~ ansible_facts['python']['version']['minor'] ~ '.')
      not in (policyd_pyvenv_cfg.content | b64decode)

- name: Read the commit the venv was installed from
  ansible.builtin.slurp:
    src: '{{ policyd_venv_path }}/.installed-commit'
  register: policyd_installed_commit
  failed_when: false

# pip reinstalls a local project every time, so only for a new commit (or a new venv)
- name: Note whether the checkout must be installed
  ansible.builtin.set_fact:
    policyd_install_needed: >-
      {{ policyd_git.after is defined
         and policyd_git.after != (policyd_installed_commit.content | default('') | b64decode | trim) }}

# setuptools builds in the checkout and keeps files of earlier builds in build/, e.g. removed modules
- name: Remove the build directory of an earlier install
  ansible.builtin.file:
    path: '{{ policyd_install_path }}/build'
    state: absent
  when: policyd_install_needed | bool

# Creates the venv if needed. Dependencies as binary wheels only, so none of their build scripts run at install time;
# the app itself is built from the checkout by setuptools (a wheel, from its declarative pyproject.toml). umask: root's may be 077, and the
# service user must be able to read the venv.
# The module runs its commands in /tmp unless told otherwise, and `python3 -m venv` imports from its working directory
# first: a venv.py that any local user put into /tmp would run as root. -I keeps the working directory off the import
# path; chdir is a second guard: root's home, which only root can write to. chdir is only the working directory, the
# venv goes to `virtualenv`, and nothing is written there (--no-cache-dir: no pip cache in /root/.cache either).
- name: Install PolicydRateGuard and its dependencies
  ansible.builtin.pip:
    name: '{{ policyd_install_path }}'
    virtualenv: '{{ policyd_venv_path }}'
    virtualenv_command: /usr/bin/python3 -I -m venv
    chdir: /root/
    extra_args: '--only-binary=:all: --no-cache-dir --disable-pip-version-check --no-input'
    umask: '0022'
  when:
    - policyd_install_needed | bool
    # in a dry run the packages above aren't installed, and the module can't run without python3-packaging
    - not (ansible_check_mode and policyd_packages | default({}) is changed)
  changed_when: true  # pip compares `pip freeze`, which doesn't change for a new commit of the same version
  # The commit is only recorded after the restart: if the run fails in between, the next run installs and restarts
  notify: [Restart policyd service, Remember the installed commit]

- name: Remove group/world write permissions and foreign ownership in the install directory
  ansible.builtin.shell:
    cmd: >-
      find {{ policyd_install_path | quote }} \( -perm /022 -not -type l \) -print -exec chmod go-w {} + ;
      find {{ policyd_install_path | quote }} \( -not -user root -o -not -group root \) -print
      -exec chown -h root:root {} +
  register: policyd_fix_permissions
  changed_when: policyd_fix_permissions.stdout | length > 0
  when: not ansible_check_mode

---
# Install PolicydRateGuard, https://github.com/onlime/policyd-rate-guard
# With every tag of the role's tasks, not `always`: a run of a site-wide playbook limited to other tags doesn't
# include the role's checks (or its refusal of an installation it didn't make)
- name: Preflight checks
  ansible.builtin.import_tasks: preflight.yml
  tags: [quick-deploy, policyd-config, policyd-mysql-users, mysql-users, policyd-logrotate]

- name: Packages and system user
  ansible.builtin.import_tasks: system.yml

- name: Code and virtualenv
  ansible.builtin.import_tasks: install.yml
  tags: [quick-deploy]

- name: Database, users and migrations
  ansible.builtin.import_tasks: database.yml

- name: Configuration
  ansible.builtin.import_tasks: config.yml

- name: Systemd units and service
  ansible.builtin.import_tasks: service.yml
  tags: [quick-deploy]

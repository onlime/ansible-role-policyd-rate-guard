---
- name: Assert a supported platform (Debian 13+)
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Debian'
      - ansible_facts['distribution_major_version'] is version('13', '>=')
    fail_msg: PolicydRateGuard 1.x needs Debian 13 (trixie) or later
    quiet: true

- name: Assert required variables
  ansible.builtin.assert:
    that:
      - policyd_version | length > 0
      - policyd_mysql_pass | length > 0
      - policyd_yoyo_mysql_pass | length > 0
      - policyd_mysql_user != policyd_yoyo_mysql_user
      - policyd_fail_action in ['DUNNO', 'DEFER_IF_PERMIT']
      - policyd_listen is not string and policyd_listen | length > 0
      - policyd_log_file.startswith('/var/log/' ~ policyd_service_name ~ '/')
      - not policyd_webhook_enabled or (policyd_webhook_url | length > 0 and policyd_webhook_secret | length > 0)
    fail_msg: >-
      Set policyd_mysql_pass and policyd_yoyo_mysql_pass (two different database users since role 1.0),
      a valid policyd_fail_action, policyd_listen (a list), policyd_log_file in /var/log/<policyd_service_name>/,
      and the webhook URL and secret when the webhook is enabled.
    quiet: true

# PolicydRateGuard 1.0 always authenticates the webhook with a JWT (Authorization: Bearer)
- name: Assert the webhook doesn't expect the removed simple token
  ansible.builtin.assert:
    that:
      - policyd_webhook_use_jwt | default(true) | bool
      - "'{token}' not in policyd_webhook_url"
    fail_msg: >-
      The simple token (policyd_webhook_use_jwt=false, {token} in policyd_webhook_url) was removed in PolicydRateGuard
      1.0: the webhook always sends a JWT in the Authorization header. Switch the receiving side to JWT and remove both.
    quiet: true

# PolicydRateGuard's `check` refuses it too, but only after the new code is installed
- name: Assert the webhook secret is base64 of at least 32 bytes (HS256)
  ansible.builtin.assert:
    that:
      - policyd_webhook_secret is regex('^([A-Za-z0-9+/]{4})*([A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$')
      - (policyd_webhook_secret | length) // 4 * 3 - (policyd_webhook_secret | regex_findall('=') | length) >= 32
    fail_msg: policyd_webhook_secret must be base64 and decode to at least 32 bytes, e.g. openssl rand -base64 32
    quiet: true
  when: policyd_webhook_enabled | bool

- name: Check the existing installation
  ansible.builtin.stat:
    path: '{{ policyd_install_path }}'
  register: policyd_install_stat

# Root runs git, pip and yoyo in the install directory: never in one that anybody else could have changed. Role
# 0.5.2+ made it owned by `postfix`; such an installation (or any 0.x one, with its run.py) has to be moved away first.
- name: Look for files not owned by root, writable by others, or of 0.x
  ansible.builtin.command:
    argv: [find, '{{ policyd_install_path }}', '(', '!', -user, root, -o, '!', -group, root, -o, '(', -perm, /022,
           '!', -type, l, ')', -o, -path, '{{ policyd_install_path }}/run.py', ')', -print, -quit]
  register: policyd_install_foreign
  changed_when: false
  check_mode: false
  when: policyd_install_stat.stat.exists

- name: Refuse an installation this role didn't make (e.g. PolicydRateGuard 0.x)
  ansible.builtin.assert:
    that: policyd_install_foreign.stdout | default('') | length == 0
    fail_msg: >-
      {{ policyd_install_path }} isn't an installation of this role ({{ policyd_install_foreign.stdout | default('') }}
      isn't owned by root, is writable by others, or is 0.x's run.py). Move it away first, see "Upgrading from 0.x"
      in the README. Nothing was changed.
    quiet: true

---
# Validated with the new code before it's put in place: `check` parses it and connects to the database
- name: Deploy the configuration
  ansible.builtin.template:
    src: policyd-rate-guard.env.j2
    dest: '{{ policyd_env_file }}'
    owner: root
    group: '{{ policyd_group }}'
    mode: '0640'
    validate: '{{ policyd_venv_path }}/bin/policyd-rate-guard --env-file %s check'
  diff: false  # contains the database password, the webhook secret and the Sentry DSN
  notify: Restart policyd service
  # also with the database users, so a password rotation by tag reaches the daemon too
  tags: [policyd-config, policyd-mysql-users, mysql-users]

# A run that fails before the handlers loses the restart, and the next run finds the file unchanged: the daemon would
# keep the old configuration, e.g. a rotated password. Restart whenever the file is newer than the running service.
- name: Read when the service was started  # noqa: command-instead-of-module (the module has no unix timestamps)
  ansible.builtin.command:
    cmd: systemctl show --property=ActiveState,ActiveEnterTimestamp --timestamp=unix {{ policyd_service_name }}.service
  register: policyd_service_show
  changed_when: false
  check_mode: false
  tags: [policyd-config, policyd-mysql-users, mysql-users]

- name: Read when the configuration was changed
  ansible.builtin.stat:
    path: '{{ policyd_env_file }}'
  register: policyd_env_stat
  tags: [policyd-config, policyd-mysql-users, mysql-users]

- name: Restart the service for a configuration it hasn't loaded
  ansible.builtin.debug:
    msg: The configuration is newer than the running service (a restart lost to an earlier failed run)
  changed_when: true
  notify: Restart policyd service
  when:
    - "'ActiveState=active' in policyd_service_show.stdout_lines"
    - policyd_env_stat.stat.exists
    - >-
      policyd_env_stat.stat.mtime | int
      > policyd_service_show.stdout | regex_findall('ActiveEnterTimestamp=@([0-9]+)') | first | default(0) | int
  tags: [policyd-config, policyd-mysql-users, mysql-users]

- name: Install the log rotation
  ansible.builtin.template:
    src: logrotate.d/policyd-rate-guard.j2
    dest: /etc/logrotate.d/{{ policyd_service_name }}
    owner: root
    group: root
    mode: '0644'
  tags: [policyd-logrotate]

# Every run, as the service user and before any restart: an unreadable venv, or a configuration that a new release
# rejects (the template only validates a changed file), would otherwise only show when the service fails to start
- name: Check the installation and the configuration as the service user
  ansible.builtin.command:
    argv:
      - runuser
      - -u
      - '{{ policyd_user }}'
      - --
      - '{{ policyd_venv_path }}/bin/policyd-rate-guard'
      - --env-file
      - '{{ policyd_env_file }}'
      - check
  changed_when: false
  when: not ansible_check_mode
  tags: [policyd-config, quick-deploy, policyd-mysql-users, mysql-users]

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
    inputs:
      app_ref:
        description: "PolicydRateGuard ref to test against (default: the role's policyd_version)"
        required: false

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: pip install ansible-core ansible-lint
      - name: ansible-lint
        run: ansible-lint --profile production

  molecule:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: PolicydRateGuard version
        id: app
        env:
          APP_REF: ${{ inputs.app_ref }}
        run: |
          ref="${APP_REF:-$(sed -n "s/^policyd_version: //p" defaults/main.yml)}"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: onlime/policyd-rate-guard
          ref: ${{ steps.app.outputs.ref }}
          path: policyd-rate-guard
          fetch-depth: 0 # a full clone, which the role clones from
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: pip install ansible-core molecule 'molecule-plugins[docker]'
      - name: Molecule
        env:
          POLICYD_REPO_PATH: ${{ github.workspace }}/policyd-rate-guard
          POLICYD_VERSION: ${{ steps.app.outputs.ref }}
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
        run: molecule test
